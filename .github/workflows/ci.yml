name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 24.x
      uses: actions/setup-node@v1.4.4
      with:
        node-version: 24.x
    - run: npm i && npm run lint
  PrepareSupportedVersions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 24.x
      uses: actions/setup-node@v1.4.4
      with:
        node-version: 24.x
    - id: set-matrix
      run: |
        node -e "
          const supportedVersions = require('./src/version').supportedVersions;
          if (!Array.isArray(supportedVersions) || !supportedVersions.length || new Set(supportedVersions).size !== supportedVersions.length || supportedVersions.some(v => typeof v !== 'string' || !v.trim())) throw new Error('Invalid test version matrix');
          console.log('matrix='+JSON.stringify({'include': supportedVersions.map(mcVersion => ({mcVersion}))}))
        " >> $GITHUB_OUTPUT
  test:
    needs: PrepareSupportedVersions
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.PrepareSupportedVersions.outputs.matrix)}}
      fail-fast: false

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 24.x
      uses: actions/setup-node@v1
      with:
        node-version: 24.x
    - name: Setup Java JDK
      uses: actions/setup-java@v1.4.3
      with:
        java-version: '25'
        distribution: 'adopt'
    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run mochaTest -- -g ${{ matrix.mcVersion }}v

  # Stable branch-protection check; every required matrix job must pass.
  ci:
    name: ci
    if: ${{ always() }}
    needs: ["Lint", "PrepareSupportedVersions", "test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all mandatory jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_JOBS: '["Lint", "PrepareSupportedVersions", "test"]'
          MATRIX_OUTPUTS: '[["PrepareSupportedVersions", "matrix", "include"]]'
        shell: python
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = json.loads(os.environ["EXPECTED_JOBS"])
          if not expected or set(needs) != set(expected):
              sys.exit("Missing or unexpected required jobs")
          failed = {name: job.get("result") for name, job in needs.items()
                    if job.get("result") != "success"}
          if failed:
              sys.exit("Required jobs did not succeed: " + json.dumps(failed))
          for job, output, field in json.loads(os.environ["MATRIX_OUTPUTS"]):
              matrix = json.loads(needs[job]["outputs"][output])
              entries = matrix[field] if field else matrix
              if not isinstance(entries, list) or not entries:
                  sys.exit("Empty or invalid required matrix: " + job)
          print("All required jobs succeeded")
